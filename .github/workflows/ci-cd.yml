name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx jest

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::205930613434:role/nonik-github-deploy-role
          aws-region: ap-northeast-2

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-08d72b36fec29d9e0" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy nonik backend from GitHub Actions (${{ github.sha }})" \
            --parameters '{"commands":[
              "cd /home/ec2-user/app/nonik",
              "sudo -u ec2-user bash -c \"cd /home/ec2-user/app/nonik && git fetch origin && git reset --hard origin/master\"",
              "sudo -u ec2-user bash -c \"cd /home/ec2-user/app/nonik && npm install\"",
              "sudo -u ec2-user bash -c \"cd /home/ec2-user/app/nonik && npm run build\"",
              "sudo -u ec2-user bash -c \"pm2 restart NONIK --update-env\""
            ]}' \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-08d72b36fec29d9e0" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: $STATUS"
            if [[ "$STATUS" != "InProgress" && "$STATUS" != "Pending" ]]; then break; fi
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-08d72b36fec29d9e0" --query "StandardOutputContent" --output text
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-08d72b36fec29d9e0" --query "StandardErrorContent" --output text

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
